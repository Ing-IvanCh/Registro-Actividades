  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-app.js";
  import {
    getFirestore, collection as fsCollection, doc as fsDoc, query as fsQuery,
    where as fsWhere, orderBy as fsOrderBy, limit as fsLimit,
    onSnapshot as fsOnSnapshot, getDocs as fsGetDocs, getDoc as fsGetDoc,
    addDoc as fsAddDoc, setDoc as fsSetDoc, updateDoc as fsUpdateDoc, deleteDoc as fsDeleteDoc
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-firestore.js";
  import {
    getAuth, signInAnonymously, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/12.8.0/firebase-auth.js";

  // --- Configuración de tu proyecto Firebase (dato público, no es una contraseña) ---
  const firebaseConfig = {
    apiKey: "AIzaSyD4HPRnO5U7p4wZ4jNfTa9umzeJACM067Y",
    authDomain: "registro-diario-de-activ-82bbc.firebaseapp.com",
    projectId: "registro-diario-de-activ-82bbc",
    storageBucket: "registro-diario-de-activ-82bbc.firebasestorage.app",
    messagingSenderId: "509408674128",
    appId: "1:509408674128:web:f857981906324954112c55"
  };
  // Correos con permisos de administrador (deben coincidir con la lista de firestore.rules)
  const ADMIN_EMAILS = [
    "ivan.chipiaje@prosolutions-int.com",
    "soporte_talento@prosolutions-int.com",
    "contabilidad@prosolutions-int.com",
    "jpaez@prosolutions-int.com",
    "dreyes@prosolutions-int.com"
  ];
  const fbApp = initializeApp(firebaseConfig);
  const firestoreDb = getFirestore(fbApp);
  const fbAuth = getAuth(fbApp);

  window.__firebaseAuth = {
    async ensureSignedIn(){
      if(!fbAuth.currentUser){ await signInAnonymously(fbAuth); }
    },
    async loginAdmin(email, password){
      await signInWithEmailAndPassword(fbAuth, email, password);
    },
    async logoutAdmin(){
      await signOut(fbAuth);
      await signInAnonymously(fbAuth);
    },
    isAdminNow(){
      const u = fbAuth.currentUser;
      return !!(u && !u.isAnonymous && u.email && ADMIN_EMAILS.includes(u.email.toLowerCase()));
    },
    onChange(cb){ onAuthStateChanged(fbAuth, cb); }
  };

  // --- Adaptador: expone la misma API encadenable (db.collection/db.doc) que ya usa la app ---
  function wrapDoc(ref){
    return {
      async get(){ const snap = await fsGetDoc(ref); return { exists: snap.exists(), data: ()=>snap.data() }; },
      async set(data){ return fsSetDoc(ref, data); },
      async update(data){ return fsUpdateDoc(ref, data); },
      async delete(){ return fsDeleteDoc(ref); },
      onSnapshot(cb, errCb){
        return fsOnSnapshot(ref, snap=> cb({ exists: snap.exists(), data: ()=>snap.data() }), errCb);
      }
    };
  }
  function wrapCollection(path){
    const base = fsCollection(firestoreDb, path);
    const constraints = [];
    const self = {
      where(f,op,v){ constraints.push(fsWhere(f,op,v)); return self; },
      orderBy(f,dir){ constraints.push(fsOrderBy(f, dir||"asc")); return self; },
      limit(n){ constraints.push(fsLimit(n)); return self; },
      async get(){
        const snap = await fsGetDocs(fsQuery(base, ...constraints));
        return { docs: snap.docs.map(d=>({ id:d.id, data:()=>d.data() })) };
      },
      onSnapshot(cb, errCb){
        return fsOnSnapshot(fsQuery(base, ...constraints), snap=>{
          cb({ docs: snap.docs.map(d=>({ id:d.id, data:()=>d.data() })) });
        }, errCb);
      },
      async add(data){ return fsAddDoc(base, data); }
    };
    return self;
  }
  window.__firebaseDb = {
    collection: (path)=>wrapCollection(path),
    doc: (path)=>wrapDoc(fsDoc(firestoreDb, path))
  };
</script>

function monthRange(ym){

  const end = ym + "-" + String(lastDay).padStart(2,"0");
  return {start, end, days: lastDay};
}
function badgeClass(estado){

  const [y,m] = ym.split("-").map(Number);
  return meses[m-1] + " " + y;
}
function sanitizeId(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9_\-.~:@+]+/g,"_").replace(/^_+|_+$/g,"") || "x";
}
function slugify(name){ return sanitizeId(name); }

function proyectoCodigo(proyectoStr){
  const m = String(proyectoStr||"").trim().match(/^(\d{3,})/);
  return m ? m[1] : null;
}
function proyectoCategoria(proyectoStr){
  if(proyectoStr===SIN_PROYECTO || proyectoStr===POR_DEFINIR || !proyectoStr) return "Apoyo interno / sin código";
  const cod = proyectoCodigo(proyectoStr);

  const first = cod[0];
  if(first==="3") return "Proyecto";

  return "Otro";
}

function tipoHint(tipo){

  if(tipo==="Extra") return `Horas extra: no cuentan para el tope de ${MAX_HORAS} h — deben marcarse como Extra para poder sumarse aparte (máx. ${MAX_EXTRA} h/día).`;
  return `Día no laborado (${tipo}): no cuenta para el tope de horas de trabajo, se registra aparte.`;
}

function computeStats(){
  const {days} = monthRange(selectedMonth);
  const weeks = days/7;
  const byEng = {};
  engineersList.forEach((e)=>byEng[e.name] = {n:0, horas:0, horasExtra:0, horasAusencia:0, horasPorTipo:{}, last:null, tasks:{}, cargo:e.cargo});
  allEntries.forEach(d=>{
    const e = byEng[d.engineer]; if(!e) return;
    const tipo = d.tipoHora || "Normal";
    const isWork = !AUSENCIA_TYPES.includes(tipo);
    e.n++;
    const h = typeof d.horas === "number" ? d.horas : 0;
    e.horasPorTipo[tipo] = (e.horasPorTipo[tipo]||0) + h;
    if(isWork){ e.horas += h; if(tipo==="Extra") e.horasExtra += h; }
    else { e.horasAusencia += h; }
    if(d.fecha && (!e.last || d.fecha > e.last)) e.last = d.fecha;
    if(!isWork) return; // las ausencias (vacaciones, incapacidad, etc.) no son "tareas" con avance
    // Agrupa por proyecto+actividad (o por id de tarea si lo tiene): una misma línea de trabajo
    // puede registrarse varios días, y lo que importa es su avance MÁS RECIENTE.
    const key = taskKey(d);
    const t = e.tasks[key] || { proyecto: d.proyecto||SIN_PROYECTO, actividad: d.actividad||"(sin definir)", pct:null, estado:null, fecha:null, _sortKey:"" };
    const sortKey = (d.fecha||"") + "T" + (d.createdAt||"");
    if(sortKey >= t._sortKey){
      t._sortKey = sortKey; t.fecha = d.fecha;
      if(typeof d.pct === "number") t.pct = d.pct;
      if(d.estado) t.estado = d.estado;
    }
    e.tasks[key] = t;
  });
  // Avance general = promedio SOLO de las tareas aún abiertas (en curso/pendiente/bloqueada).
  // Las tareas completadas NO se promedian con las demás: cuentan aparte como logro, así que
  // terminar una tarea nunca baja el número — en el peor de los casos simplemente sale del promedio.
  Object.values(byEng).forEach(e=>{
    const tasksArr = Object.values(e.tasks).sort((a,b)=> (b._sortKey||"").localeCompare(a._sortKey||""));
    e.taskList = tasksArr;
    const completadas = tasksArr.filter(t=>t.estado==="Completada");
    const abiertas = tasksArr.filter(t=>t.estado!=="Completada");
    const abiertasConPct = abiertas.filter(t=>t.pct!=null);
    e.completedCount = completadas.length;
    e.openCount = abiertas.length;
    if(abiertasConPct.length){
      e.lastPct = Math.round(abiertasConPct.reduce((s,t)=>s+t.pct,0)/abiertasConPct.length);
    } else if(completadas.length){
      e.lastPct = 100; // todo lo que tenía abierto este mes ya quedó completado
    } else {
      e.lastPct = null;
    }
  });
  return {byEng, weeks};
}

    let estado = "Sin registros", color="var(--bad)";
    if(e.n>0){
      if(avg===null) { estado="Sin datos"; color="var(--sub)"; }
      else if(avg>=80){ estado="Buen ritmo"; color="var(--ok)"; }
      else if(avg>=40){ estado="En progreso"; color="var(--warn)"; }
      else { estado="Rezagado"; color="var(--bad)"; }
    }
    const alerta = diasSin!==null && diasSin>5 ? ` · <span style="color:var(--bad)">${diasSin} días sin actualizar</span>` : "";
    const estKey = slugify(eng.name);

    const estWeeklyNum = estimates[estKey]!=null ? Number(estimates[estKey]) : null;
    const estMes = estWeeklyNum!=null ? (estWeeklyNum*weeks).toFixed(1) : null;

    </div>`;
  }).join("");
  return `

  if(box){ box.textContent = text; box.className = "msg " + type; }
}

function wireEvents(){
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ view = t.dataset.tab; pendingConfirm = null; render(); };
  });
  const btnDismissError = document.getElementById("btn_dismiss_error");
  if(btnDismissError) btnDismissError.onclick = ()=>{ globalError = ""; render(); };
  const btnAdminToggle = document.getElementById("btn_admin_toggle");
  if(btnAdminToggle) btnAdminToggle.onclick = ()=>{
    if(isOwner){ lockAdmin(); return; }
    adminLoginOpen = true; adminLoginError = ""; render();
  };
  const adminBackdrop = document.getElementById("admin_modal_backdrop");
  if(adminBackdrop) adminBackdrop.addEventListener("click", (e)=>{ if(e.target===adminBackdrop){ adminLoginOpen=false; render(); } });
  const btnAdminCancel = document.getElementById("btn_admin_cancel");
  if(btnAdminCancel) btnAdminCancel.onclick = ()=>{ adminLoginOpen=false; render(); };
  const btnAdminSubmit = document.getElementById("btn_admin_submit");
  if(btnAdminSubmit) btnAdminSubmit.onclick = ()=> submitAdminLogin();
  const adminEmailInput = document.getElementById("admin_email_input");
  if(adminEmailInput){ adminEmailInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submitAdminLogin(); }); adminEmailInput.focus(); }
  const adminPassInput = document.getElementById("admin_pass_input");
  if(adminPassInput) adminPassInput.addEventListener("keydown",(e)=>{ if(e.key==="Enter") submitAdminLogin(); });
  const monthSel = document.getElementById("month_sel");
  if(monthSel) monthSel.onchange = (e)=>{
    selectedMonth = e.target.value;
    localStorage.setItem("ivan_sel_month", selectedMonth);
    subscribeMine(); subscribeAll(); render();
  };
  const engSel = document.getElementById("eng_select");
  if(engSel) engSel.onchange = (e)=>{
    selectedEngineer = e.target.value;
    localStorage.setItem("ivan_sel_eng", selectedEngineer);
    selectedTaskOption = "";
    subscribeMine(); subscribeOpenTasks(); render();
  };
  const form = document.getElementById("entry_form");
  if(form) form.onsubmit = onSubmit;
  const btnCancelEdit = document.getElementById("btn_cancel_edit");
  if(btnCancelEdit) btnCancelEdit.onclick = ()=>{
    editingId = null; editingTaskId = null;
    render();
    const f = document.getElementById("f_fecha");
    if(f) f.value = todayStr();
  };
  const tipoSel = document.getElementById("f_tipo");
  if(tipoSel) tipoSel.onchange = (e)=>{
    selectedTipoHora = e.target.value;
    render();
    const horasEl = document.getElementById("f_horas");
    if(horasEl && AUSENCIA_TYPES.includes(selectedTipoHora) && !horasEl.value){ horasEl.value = MAX_HORAS; }
  };
  // required dinámico: los campos de trabajo no son obligatorios si el tipo de hora es una ausencia
  const isWork = !AUSENCIA_TYPES.includes(selectedTipoHora);
  ["f_estado","f_actividad","f_detalle","f_pct"].forEach(id=>{
    const el = document.getElementById(id);
    if(el) el.required = isWork;
  });
  const taskSel = document.getElementById("f_task");
  if(taskSel) taskSel.onchange = (e)=>{
    selectedTaskOption = e.target.value;
    const actEl = document.getElementById("f_actividad");
    const detEl = document.getElementById("f_detalle");
    const proyEl = document.getElementById("f_proyecto");
    const estEl = document.getElementById("f_estado");
    const pctEl = document.getElementById("f_pct");
    if(selectedTaskOption){
      const t = openTasksList.find(x=>x.taskId===selectedTaskOption);

        if(detEl) detEl.value = t.detalle||"";
        if(proyEl) proyEl.value = t.proyecto||"";
        if(estEl) estEl.value = (t.estado==="Bloqueada") ? "En curso" : (t.estado||"");
        if(pctEl) pctEl.value = t.pct!=null?t.pct:"";
      }
    } else {
      if(actEl) actEl.value = ""; if(detEl) detEl.value = ""; if(proyEl) proyEl.value = "";
      if(estEl) estEl.value = ""; if(pctEl) pctEl.value = "";

  });

    inp.onchange = async (e)=>{

      try{ await db.doc("config/estimates").set({...estimates, [key]: val}); }
      catch(err){ showMsg("No se pudo guardar el estimado: "+(err.message||err.code), "bad"); }

  if(btnCbWord) btnCbWord.onclick = downloadCompBonosReport;
  document.querySelectorAll("details[data-fold]").forEach(el=>{
    el.addEventListener("toggle", ()=>{ if(el.open) openFolds.add(el.dataset.fold); else openFolds.delete(el.dataset.fold); });
  });
}

async function handleAction(act, ds){
  if(act === "cancel-confirm"){ pendingConfirm = null; render(); return; }

  if(act === "ask-del-activity"){ pendingConfirm = {type:"activity", key: ds.id}; render(); return; }
  if(act === "confirm-del-activity"){
    pendingConfirm = null;
    try{ await db.doc("activities/"+ds.id).delete(); showMsg("Registro eliminado.", "ok"); }
    catch(err){ showMsg("No se pudo eliminar: " + (err.message||err.code), "bad"); render(); }
    return;
  }
  if(act === "edit-activity"){
    const d = myEntries.find(e=>e._id===ds.id);
    if(!d) return;
    editingId = ds.id;
    editingTaskId = d.taskId || null;
    selectedTipoHora = d.tipoHora || "Normal";
    render();
    document.getElementById("f_fecha").value = d.fecha||"";
    document.getElementById("f_tipo").value = selectedTipoHora;
    document.getElementById("f_actividad").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.actividad||"");
    document.getElementById("f_detalle").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.detalle||"");
    document.getElementById("f_proyecto").value = AUSENCIA_TYPES.includes(selectedTipoHora) ? "" : (d.proyecto||"");
    document.getElementById("f_estado").value = d.estado||"";
    document.getElementById("f_pct").value = d.pct!=null?d.pct:"";
    document.getElementById("f_horas").value = d.horas!=null?d.horas:"";
    document.getElementById("f_obs").value = d.obs||"";
    const extraSubEl = document.getElementById("f_extra_sub");
    if(extraSubEl) extraSubEl.value = d.extraTipo || "Trabajo normal";
    document.getElementById("entry_form").scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }

  if(act === "cb-open"){
    if(ds.tab==="comp") compSel = (compSel===ds.eng) ? "" : ds.eng;
    else bonoSel = (bonoSel===ds.eng) ? "" : ds.eng;
    formMsg = ""; render();
    const el = document.getElementById("cb_detalle"); if(el) el.scrollIntoView({behavior:"smooth", block:"start"});
    return;
  }
  if(act === "cb-trat"){ await cbSaveTratamiento(ds.id, ds.v); return; }
  if(act === "cb-dom-pago"){ await cbToggleDomPago(ds.id); return; }
  if(act === "cb-bono-pago"){ await cbToggleBono(ds.eng, ds.fecha); return; }
  if(act === "cb-saldo-pago"){ await cbToggleSaldoPago(ds.eng, ds.kind); return; }
  if(act === "cb-save-saldo"){ await cbSaveSaldo(ds.eng, ds.kind); return; }

  if(act === "save-engineer"){ await trySaveEngineer(Number(ds.i)); return; }
  if(act === "ask-del-engineer"){ pendingConfirm = {type:"deleteEngineer", key: Number(ds.i)}; render(); return; }
  if(act === "confirm-del-engineer"){ await doDeleteEngineer(Number(ds.i)); return; }
  if(act === "confirm-rename"){ await doRenameEngineer(Number(ds.i)); return; }

  if(act === "save-project"){ await trySaveProject(Number(ds.i)); return; }
  if(act === "ask-del-project"){ pendingConfirm = {type:"deleteProject", key: Number(ds.i)}; render(); return; }
  if(act === "confirm-del-project"){ await doDeleteProject(Number(ds.i)); return; }
}

async function onSubmit(ev){
  ev.preventDefault();
  if(!db){ showMsg("Conectando con el almacenamiento, intenta de nuevo en unos segundos.", "bad"); return; }
  const fecha = document.getElementById("f_fecha").value;
  const tipoHora = document.getElementById("f_tipo").value || "Normal";
  const isWork = !AUSENCIA_TYPES.includes(tipoHora);
  const horas = Number(document.getElementById("f_horas").value);
  const obs = document.getElementById("f_obs").value.trim();
  let extraTipo = null;
  if(tipoHora==="Extra"){
    const extraSubEl = document.getElementById("f_extra_sub");
    extraTipo = extraSubEl ? extraSubEl.value : "Trabajo normal";
  }

  let actividad, detalle, proyecto, estado, pct;
  if(isWork){
    actividad = document.getElementById("f_actividad").value;
    detalle = document.getElementById("f_detalle").value.trim();
    proyecto = document.getElementById("f_proyecto").value.trim() || SIN_PROYECTO;
    estado = document.getElementById("f_estado").value;
    pct = Number(document.getElementById("f_pct").value);
    if(!fecha || !actividad || !detalle || !estado){ showMsg("Completa todos los campos obligatorios.", "bad"); return; }
    if(isNaN(pct) || pct<0 || pct>100){ showMsg("El % de avance debe estar entre 0 y 100.", "bad"); return; }
  } else {
    actividad = tipoHora; // así "Vacaciones", "Incapacidad", etc. aparecen agrupadas en los reportes
    detalle = obs || tipoHora;
    proyecto = SIN_PROYECTO;
    estado = null; pct = null;
    if(!fecha){ showMsg("Selecciona la fecha.", "bad"); return; }
  }
  const cap = TIPO_MAX[tipoHora] ?? MAX_HORAS;
  if(isNaN(horas) || horas<0 || horas>cap){ showMsg(`Las horas de tipo "${tipoHora}" deben estar entre 0 y ${cap}.`, "bad"); return; }

  try{
    const snap = await db.collection("activities")
      .where("engineer","==",selectedEngineer).where("fecha","==",fecha).get();
    const yaRegistradas = snap.docs
      .filter(d=> d.id !== editingId && (d.data().tipoHora||"Normal") === tipoHora)
      .reduce((s,d)=> s + (typeof d.data().horas==="number"?d.data().horas:0), 0);
    if(yaRegistradas + horas > cap + 0.001){
      showMsg(`La suma de horas tipo "${tipoHora}" para ${fecha} supera ${cap} h (ya tienes ${yaRegistradas.toFixed(1)} h registradas ese día).`, "bad");
      return;
    }
    if(editingId){
      await db.doc("activities/"+editingId).update({
        engineer: selectedEngineer, fecha, tipoHora, actividad, detalle, proyecto, estado, pct, horas, obs, extraTipo
        // taskId no se toca al editar: un registro pasado siempre sigue perteneciendo a la misma tarea
      });
      showMsg("Registro actualizado correctamente.", "ok");
      editingId = null; editingTaskId = null;
    } else {
      const taskId = isWork ? (selectedTaskOption || newTaskId()) : null;
      await db.collection("activities").add({
        engineer: selectedEngineer, fecha, tipoHora, actividad, detalle, proyecto, estado, pct, horas, obs, taskId, extraTipo,
        createdAt: new Date().toISOString()
      });
      showMsg("Registro guardado correctamente.", "ok");
      selectedTaskOption = "";
    }
    ev.target.reset();
    document.getElementById("f_fecha").value = todayStr();
    selectedTipoHora = "Normal";
    render();
  }catch(err){
    showMsg("No se pudo guardar: " + (err.message || err.code), "bad");
  }
}

// ---------- Equipo: cada ingeniero es un documento independiente en config_engineers/<slug> ----------
async function trySaveEngineer(i){
  const eng = engineersList[i];
  const nameInput = document.querySelector(`.eq_name[data-i="${i}"]`);
  const cargoInput = document.querySelector(`.eq_cargo[data-i="${i}"]`);
  const newName = nameInput.value.trim();
  const newCargo = cargoInput.value.trim();
  if(!newName){ showMsg("El nombre no puede quedar vacío.", "bad"); return; }
  const newId = slugify(newName);
  if(newId !== eng.id){
    pendingConfirm = { type:"renameEngineer", key:i, name:newName, cargo:newCargo, oldName:eng.name, oldId:eng.id, newId };
    render();
    return;
  }
  try{
    await db.doc("config_engineers/"+eng.id).set({ name:newName, cargo:newCargo });
    showMsg("Ingeniero actualizado.", "ok");
  }catch(err){
    showMsg("No se pudo guardar (recuerda: solo el dueño del documento puede editar el equipo). " + (err.message||err.code), "bad");
  }
}

async function doRenameEngineer(i){
  const { name:newName, cargo:newCargo, oldName, oldId, newId } = pendingConfirm;
  pendingConfirm = null;
  try{
    const snap = await db.collection("activities").where("engineer","==",oldName).get();
    for(const d of snap.docs){ await db.doc("activities/"+d.id).update({ engineer: newName }); }
    await db.doc("config_engineers/"+newId).set({ name:newName, cargo:newCargo });
    if(newId !== oldId){ await db.doc("config_engineers/"+oldId).delete(); }
    if(selectedEngineer === oldName) selectedEngineer = newName;
    showMsg("Ingeniero renombrado y registros históricos actualizados.", "ok");
  }catch(err){
    showMsg("No se pudo renombrar: " + (err.message||err.code), "bad");
    render();
  }
}

async function doDeleteEngineer(i){
  pendingConfirm = null;
  const eng = engineersList[i];
  try{ await db.doc("config_engineers/"+eng.id).delete(); showMsg("Ingeniero eliminado de la lista activa.", "ok"); }
  catch(err){ showMsg("No se pudo eliminar: " + (err.message||err.code), "bad"); render(); }
}

async function importSeedData(){
  if(!confirm(`Vas a importar ${SEED_DATA.activities.length} registros de actividad, ${SEED_DATA.engineers.length} ingenieros y ${SEED_DATA.projects.length} proyectos. Úsalo solo UNA vez. ¿Continuar?`)) return;
  try{
    for(const e of SEED_DATA.engineers){ await db.doc("config_engineers/"+e.id).set({name:e.name, cargo:e.cargo}); }
    for(const p of SEED_DATA.projects){ await db.doc("config_projects/"+p.id).set({codigo:p.codigo, nombre:p.nombre}); }
    await db.doc("config/estimates").set(SEED_DATA.estimates);
    for(const a of SEED_DATA.activities){ await db.collection("activities").add(a); }
    showMsg("Datos de respaldo importados correctamente.", "ok");
  }catch(err){
    showMsg("Error al importar: " + (err.message||err.code), "bad");
  }
}

}

// ---------- Compensatorios y Bonos de campo (dos pestañas, solo admin) ----------
// Reglas acordadas:
//  COMPENSATORIOS (en horas; 1 día = 8.5 h)
//   · Toda hora Extra suma a compensatorio, salvo domingos/festivos que se pagan en dinero.
//   · Domingo/festivo (trabajo normal) = pago en dinero por defecto; el admin puede pasarlo a compensatorio.
//   · Movilización a campo SIEMPRE se compensa, aunque sea domingo o festivo.
//   · Se descuenta solo cada registro con tipo de hora "Compensatorio".
//  BONOS DE CAMPO (en días)
//   · 1 día por cada fecha con "Servicio (en campo)" y horas > 0 (sábados y domingos incluidos).
//   · No suman: el día de viaje (movilización) ni el domingo/festivo que se paga en dinero.
//  PUNTO DE PARTIDA: la app cuenta desde SALDO_CORTE; lo anterior es el saldo del Excel.
const SALDO_CORTE = "2026-10-01";
const SALDO_VERSION = 2;
function fmtN(n){ return String(Math.round((Number(n)||0)*100)/100); }
function fmtHD(h){ return `${fmtN(h)} h (${fmtN((Number(h)||0)/MAX_HORAS)} d)`; }
function escH(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function campoPagoId(engineer, fecha){ return sanitizeId(engineer) + "_" + fecha; }
function esMovilizacion(d){ return d.extraTipo === "Movilización a campo"; }
function puedeElegirPago(d){ return d.tipoHora==="Extra" && !esMovilizacion(d) && esDominical(d.fecha); }
function tratamientoDe(d){
  if(!puedeElegirPago(d)) return "Tiempo";           // entre semana, sábado y movilización: siempre compensatorio
  const a = compAjustes[d._id];
  return (a && a.tratamiento) || "Pago";             // domingo/festivo: pago por defecto
}
// Mes en que queda registrado un pago: el mes seleccionado arriba, pero nunca antes del mes del propio registro
function mesPagoPara(fecha){ const m = (fecha||"").slice(0,7); return m > selectedMonth ? m : selectedMonth; }
function saldoDe(name){
  const saved = compSaldos[slugify(name)];
  if(saved && saved.v === SALDO_VERSION) return saved;
  const ref = excelRef(name);
  return ref
    ? { v:SALDO_VERSION, compHoras:ref.compHoras, domHoras:ref.domHoras, bonoDias:ref.bonoDias, domSaldoMesPago:"", bonoSaldoMesPago:"", _auto:true }
    : { v:SALDO_VERSION, compHoras:0, domHoras:0, bonoDias:0, domSaldoMesPago:"", bonoSaldoMesPago:"", _auto:true, _sinExcel:true };
}

function computeCompBonos(){
  const names = new Set(engineerNames());
  const res = {};
  names.forEach(n=>{
    res[n] = { name:n, saldo:saldoDe(n), pago:[], tiempo:[], tomados:[], dias:[], noSuman:[] };
  });
  const enRango = d => d.fecha && d.fecha >= SALDO_CORTE;
  const diasPagados = new Set(); // ingeniero|fecha de domingos/festivos pagados en dinero (no suman bono)
  compEntries.forEach(d=>{
    const r = res[d.engineer]; if(!r || !enRango(d)) return;
    const h = Number(d.horas)||0;
    if(d.tipoHora === "Extra"){
      const tratamiento = tratamientoDe(d);
      if(tratamiento === "Pago"){
        const aj = compAjustes[d._id] || {};
        r.pago.push({ ...d, h, pagado: !!aj.pagado, mesPago: aj.mesPago||"" });
        diasPagados.add(d.engineer+"|"+d.fecha);
      } else {
        r.tiempo.push({ ...d, h });
      }
    } else if(d.tipoHora === "Compensatorio"){
      r.tomados.push({ ...d, h });
    }
  });
  const dias = {};
  campoEntries.forEach(d=>{
    const r = res[d.engineer]; if(!r || !enRango(d)) return;
    if(!((Number(d.horas)||0) > 0)) return;
    if(d.tipoHora === "Extra" && esMovilizacion(d)) return; // el viaje no suma bono
    const k = d.engineer+"|"+d.fecha;
    if(!dias[k]) dias[k] = { engineer:d.engineer, fecha:d.fecha, horas:0, proyectos:new Set() };
    dias[k].horas += Number(d.horas)||0;
    if(d.proyecto) dias[k].proyectos.add(d.proyecto);
  });
  Object.entries(dias).forEach(([k,x])=>{
    x.proyecto = [...x.proyectos].join(", ");
    const r = res[x.engineer];
    if(esDominical(x.fecha) && diasPagados.has(k)){ r.noSuman.push(x); return; }
    const p = campoPagos[campoPagoId(x.engineer, x.fecha)];
    x.pagado = !!(p && p.pagado); x.mesPago = (p && p.mesPago) || "";
    r.dias.push(x);
  });
  const desc = (a,b)=> (b.fecha||"").localeCompare(a.fecha||"");
  Object.values(res).forEach(r=>{
    [r.pago, r.tiempo, r.tomados, r.dias, r.noSuman].forEach(l=>l.sort(desc));
    const s = r.saldo;
    r.compSaldoH = Number(s.compHoras)||0;
    r.compGenH = r.tiempo.reduce((a,d)=>a+d.h,0);
    r.compTomH = r.tomados.reduce((a,d)=>a+d.h,0);
    r.compPendH = r.compSaldoH + r.compGenH - r.compTomH;
    r.domSaldoH = Number(s.domHoras)||0;
    r.domPendH = (s.domSaldoMesPago ? 0 : r.domSaldoH) + r.pago.filter(d=>!d.pagado).reduce((a,d)=>a+d.h,0);
    r.bonoSaldo = Number(s.bonoDias)||0;
    r.bonoPend = (s.bonoSaldoMesPago ? 0 : r.bonoSaldo) + r.dias.filter(x=>!x.pagado).length;
    r.bonoPag = (s.bonoSaldoMesPago ? r.bonoSaldo : 0) + r.dias.filter(x=>x.pagado).length;
  });
  return res;
}
function cbList(res){
  const order = engineerNames();
  return Object.values(res).sort((a,b)=> order.indexOf(a.name) - order.indexOf(b.name));
}

function cbFold(key, title, inner){
  return `<details class="cbfold" data-fold="${key}" ${openFolds.has(key)?"open":""}><summary>${title}</summary><div class="cbfold-body">${inner}</div></details>`;
}
function cbTable(headers, rows){
  return `<div class="scroll-x"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function cbTop(tabLabel){
  const antesDeCorte = selectedMonth < SALDO_CORTE.slice(0,7);
  return `<div class="dl-row">
      <button class="secondary" id="btn_cb_word">📄 Informe de compensatorios y bonos (${monthLabel(selectedMonth)})</button>
    </div>
    ${antesDeCorte ? `<div class="msg bad" style="display:block">El control empieza el ${SALDO_CORTE}. Elige octubre 2026 o un mes posterior arriba.</div>` : ""}
    <div class="hint" style="margin:-4px 0 12px">Lo que marques como pagado queda registrado en el mes seleccionado arriba: <b>${monthLabel(selectedMonth)}</b>.</div>`;
}
function cbExcelHint(r, kind){
  const ref = excelRef(r.name);
  if(!ref) return `Sin datos en el Excel para este ingeniero.`;
  const v = kind==="comp" ? `compensatorio ${fmtHD(ref.compHoras)} · domingos por pagar ${fmtHD(ref.domHoras)}` : `${ref.bonoDias} días de bono pendientes`;
  return `Excel (${escH(ref.nombre)}): ${v}.${r.saldo._auto ? " <b>Cargado automáticamente.</b>" : " Corregido por ti."}`;
}

// --- Pestaña Compensatorios ---
function renderCompensatorios(){
  if(!(compLoaded.comp && compLoaded.campo)) return `<div class="card"><div class="empty">Cargando compensatorios…</div></div>`;
  const res = computeCompBonos();
  const list = cbList(res);
  if(compSel && !res[compSel]) compSel = "";
  const cards = list.map(r=>`
    <div class="cbcard ${r.name===compSel?"sel":""}" data-act="cb-open" data-tab="comp" data-eng="${escH(r.name)}">
      <div class="cbname">${escH(r.name)}</div>
      <div class="cbbig" ${r.compPendH<0?'style="color:var(--bad)"':''}>${fmtN(r.compPendH)} h</div>
      <div class="cbsub">${fmtN(r.compPendH/MAX_HORAS)} días de compensatorio pendientes</div>
      ${r.domPendH>0 ? `<div class="cbsub" style="color:var(--warn)">Por pagar en dinero: ${fmtN(r.domPendH)} h</div>` : `<div class="cbsub">Sin domingos por pagar</div>`}
    </div>`).join("");
  let html = `${cbTop()}
  <div class="card">

function renderCompDetalle(r){
  const s = r.saldo;
  const k = slugify(r.name);
  // 1) Por pagar en dinero (pendientes)
  const pendPago = r.pago.filter(d=>!d.pagado);
  const excelDomPend = r.domSaldoH>0 && !s.domSaldoMesPago;
  const pagoRows = (excelDomPend ? `<tr>
      <td data-label="Fecha">Antes del ${SALDO_CORTE}</td><td data-label="Día">—</td><td data-label="Detalle">Saldo del Excel</td>

    + pendPago.map(d=>`<tr>
      <td data-label="Fecha">${d.fecha}</td><td data-label="Día">${diaLabel(d.fecha)}</td>
      <td data-label="Detalle">${escH(d.detalle||d.actividad||"")}${d.proyecto?`<div class="hint">${escH(d.proyecto)}</div>`:""}</td>
      <td data-label="Horas">${fmtN(d.h)} h</td>

  // 2) Movimientos de compensatorio: mes seleccionado arriba, anteriores plegados
  const movs = r.tiempo.map(d=>({ ...d, signo:+1, concepto: esMovilizacion(d) ? "Extra · movilización" : (esDominical(d.fecha) ? "Extra · domingo/festivo (compensado)" : "Extra · trabajo") }))
    .concat(r.tomados.map(d=>({ ...d, signo:-1, concepto: "Compensatorio tomado" + (d.obs ? " · "+d.obs : "") })))
    .sort((a,b)=> (b.fecha||"").localeCompare(a.fecha||""));

  const movMes = movs.filter(d=>d.fecha.slice(0,7)===selectedMonth);
  const movOtros = movs.filter(d=>d.fecha.slice(0,7)!==selectedMonth);
  // 3) Ya pagados en dinero (plegado)
  const pagados = r.pago.filter(d=>d.pagado);
  const pagadosRows = (r.domSaldoH>0 && s.domSaldoMesPago ? `<tr>
      <td data-label="Fecha">Antes del ${SALDO_CORTE}</td><td data-label="Detalle">Saldo del Excel</td><td data-label="Horas">${fmtN(r.domSaldoH)} h</td>

  const nPagados = pagados.length + (r.domSaldoH>0 && s.domSaldoMesPago ? 1 : 0);

    ${movOtros.length ? cbFold("comp-otros-"+k, `Movimientos de otros meses (${movOtros.length})`, cbTable(["Fecha","Día","Concepto","Horas",""], movOtros.map(movRow).join(""))) : ""}
    ${nPagados ? cbFold("comp-pagados-"+k, `Ya pagados en dinero (${nPagados})`, cbTable(["Fecha","Detalle","Horas","Mes de pago",""], pagadosRows)) : ""}

}

async function cbWriteSaldo(engineer, patch){

  delete base._auto; delete base._sinExcel;
  const data = { ...base, ...patch, v:SALDO_VERSION, engineer, updatedAt:new Date().toISOString() };

async function cbToggleSaldoPago(engineer, kind){

  const mes = s[campo] ? "" : (selectedMonth < SALDO_CORTE.slice(0,7) ? SALDO_CORTE.slice(0,7) : selectedMonth);

async function cbSaveSaldo(engineer, kind){
  const num = id=>{ const el=document.getElementById(id); const v = el ? el.value.trim() : ""; return v==="" ? 0 : Number(v); };
  const patch = kind==="comp" ? { compHoras: num("saldo_comp_h"), domHoras: num("saldo_dom_h") } : { bonoDias: num("saldo_bono_d") };

  try{ await cbWriteSaldo(engineer, patch); showMsg("Saldo inicial guardado.", "ok"); }
  catch(err){ showMsg(CB_ERR + (err.message||err.code), "bad"); }
}

// --- Informe Word de compensatorios y bonos (mismo membrete que el de horas) ---
function cbMonthData(r, ym){
  const {start, end} = monthRange(ym);
  const inMes = f => f>=start && f<=end;
  const s = r.saldo;
  // Compensatorio (h)
  const compIni = r.compSaldoH + r.tiempo.filter(d=>d.fecha<start).reduce((a,d)=>a+d.h,0) - r.tomados.filter(d=>d.fecha<start).reduce((a,d)=>a+d.h,0);
  const compGen = r.tiempo.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  const compTom = r.tomados.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  // Domingos/festivos por pagar (h): pendiente al inicio = generado antes del mes y no pagado antes del mes
  const pendAntes = (fecha, pagado, mesPago) => fecha<start && (!pagado || mesPago>=ym);
  const domIni = (r.domSaldoH>0 && (!s.domSaldoMesPago || s.domSaldoMesPago>=ym) ? r.domSaldoH : 0)
    + r.pago.filter(d=>pendAntes(d.fecha, d.pagado, d.mesPago)).reduce((a,d)=>a+d.h,0);
  const domGen = r.pago.filter(d=>inMes(d.fecha)).reduce((a,d)=>a+d.h,0);
  const domPag = (s.domSaldoMesPago===ym ? r.domSaldoH : 0) + r.pago.filter(d=>d.pagado && d.mesPago===ym).reduce((a,d)=>a+d.h,0);
  // Bono (días)
  const bonoIni = (r.bonoSaldo>0 && (!s.bonoSaldoMesPago || s.bonoSaldoMesPago>=ym) ? r.bonoSaldo : 0)
    + r.dias.filter(x=>pendAntes(x.fecha, x.pagado, x.mesPago)).length;
  const bonoGen = r.dias.filter(x=>inMes(x.fecha)).length;
  const bonoPag = (s.bonoSaldoMesPago===ym ? r.bonoSaldo : 0) + r.dias.filter(x=>x.pagado && x.mesPago===ym).length;
  return { compIni, compGen, compTom, compFin: compIni+compGen-compTom, domIni, domGen, domPag, domFin: domIni+domGen-domPag, bonoIni, bonoGen, bonoPag, bonoFin: bonoIni+bonoGen-bonoPag, inMes };
}

async function downloadCompBonosReport(){
  if(!downloadsCap){ showMsg("La descarga no está disponible en esta vista.", "bad"); return; }
  if(typeof JSZip === "undefined"){ showMsg("No se pudo cargar el generador de Word. Intenta de nuevo.", "bad"); return; }
  const ym = selectedMonth;
  if(ym < SALDO_CORTE.slice(0,7)){ showMsg(`El control empieza el ${SALDO_CORTE}. Elige octubre 2026 o un mes posterior.`, "bad"); return; }
  const res = computeCompBonos();
  const list = cbList(res);
  const rows = list.map(r=>({ r, m: cbMonthData(r, ym) }));
  const d = h=>fmtN((Number(h)||0)/MAX_HORAS);
  let body = "";
  body += wp("INFORME DE COMPENSATORIOS Y BONOS DE CAMPO", {bold:true, color:"1F4E78", size:32, after:40});
  body += wp("Área de Proyectos", {bold:true, color:"6B7280", size:24, after:20});
  body += wp(`Periodo: ${monthLabel(ym)}   ·   Generado: ${new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})}`, {italics:true, color:"6B7280", size:20, after:200});
  body += wp(`Criterios: toda hora extra genera compensatorio, excepto domingos y festivos reconocidos como pago en dinero; la movilización a campo siempre se compensa. Cada día registrado como "Compensatorio" se descuenta del saldo. El bono de campo suma un día por cada fecha laborada en campo (actividad "${ACTIVIDAD_CAMPO}"); no suman los días de viaje ni los domingos o festivos pagados en dinero. Saldos iniciales tomados del Control Integral de Ingenieros (Excel) con corte al ${SALDO_CORTE}. Un día equivale a ${MAX_HORAS} horas.`, {size:18, color:"374151", after:200});

  // 1. Compensatorios
  body += wHeading("1. Compensatorios");
  body += wp("1.1 Saldo de compensatorio por colaborador (horas)", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Saldo al inicio","Generado en el mes","Tomado en el mes","Saldo al cierre","Cierre (días)"], [2280,1560,1560,1560,1560,1560],
    rows.map(({r,m})=>[r.name, fmtN(m.compIni)+" h", "+"+fmtN(m.compGen)+" h", "−"+fmtN(m.compTom)+" h", fmtN(m.compFin)+" h", d(m.compFin)+" d"]));
  body += wp("1.2 Domingos y festivos por pagar en dinero (horas)", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Pendiente al inicio","Generado en el mes","Pagado en el mes","Pendiente al cierre"], [2480,1900,1900,1900,1900],
    rows.map(({r,m})=>[r.name, fmtN(m.domIni)+" h", "+"+fmtN(m.domGen)+" h", "−"+fmtN(m.domPag)+" h", fmtN(m.domFin)+" h"]));
  const compMovs = [];
  rows.forEach(({r,m})=>{
    r.tiempo.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, esMovilizacion(x) ? "Extra · movilización → compensatorio" : "Extra → compensatorio", "+"+fmtN(x.h)+" h"]));
    r.tomados.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Compensatorio tomado", "−"+fmtN(x.h)+" h"]));
    r.pago.filter(x=>m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Extra domingo/festivo → pago en dinero" + (x.pagado ? ` (pagado ${monthLabel(x.mesPago)})` : " (pendiente)"), fmtN(x.h)+" h"]));
    r.pago.filter(x=>x.pagado && x.mesPago===ym && !m.inMes(x.fecha)).forEach(x=>compMovs.push([x.fecha, diaLabel(x.fecha), r.name, "Pago en dinero de domingo/festivo anterior", fmtN(x.h)+" h"]));
    if(r.saldo.domSaldoMesPago===ym && r.domSaldoH>0) compMovs.push(["—", "—", r.name, "Pago de domingos del saldo Excel", fmtN(r.domSaldoH)+" h"]);
  });
  compMovs.sort((a,b)=> a[2].localeCompare(b[2]) || a[0].localeCompare(b[0]));
  body += wp("1.3 Detalle de movimientos del mes", {bold:true, size:19, after:80});
  body += compMovs.length ? wTable(["Fecha","Día","Colaborador","Concepto","Horas"], [1300,1200,1900,4380,1300], compMovs)
    : wp("Sin movimientos de compensatorio en el periodo.", {italics:true, color:"6B7280"});

  // 2. Bonos de campo
  body += wHeading("2. Bonos de campo");
  body += wp("2.1 Días de bono de campo por colaborador", {bold:true, size:19, after:80});
  body += wTable(["Colaborador","Pendiente al inicio","Días en campo del mes","Pagados en el mes","Pendiente al cierre"], [2480,1900,1900,1900,1900],
    rows.map(({r,m})=>[r.name, fmtN(m.bonoIni)+" d", "+"+m.bonoGen+" d", "−"+fmtN(m.bonoPag)+" d", fmtN(m.bonoFin)+" d"]));
  const bonoMovs = [];
  rows.forEach(({r,m})=>{
    r.dias.filter(x=>m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", x.pagado ? `Pagado (${monthLabel(x.mesPago)})` : "Pendiente"]));
    r.dias.filter(x=>x.pagado && x.mesPago===ym && !m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", "Pago en este mes (día de un mes anterior)"]));
    r.noSuman.filter(x=>m.inMes(x.fecha)).forEach(x=>bonoMovs.push([x.fecha, diaLabel(x.fecha), r.name, x.proyecto||"—", "No suma: domingo/festivo pagado en dinero"]));
    if(r.saldo.bonoSaldoMesPago===ym && r.bonoSaldo>0) bonoMovs.push(["—", "—", r.name, "Saldo del Excel", `Pago de ${fmtN(r.bonoSaldo)} días`]);
  });
  bonoMovs.sort((a,b)=> a[2].localeCompare(b[2]) || a[0].localeCompare(b[0]));
  body += wp("2.2 Detalle de días en campo y pagos del mes", {bold:true, size:19, after:80});
  body += bonoMovs.length ? wTable(["Fecha","Día","Colaborador","Proyecto","Estado"], [1300,1200,1900,3080,2600], bonoMovs)
    : wp("Sin días en campo ni pagos de bono en el periodo.", {italics:true, color:"6B7280"});
  body += wp("Informe generado a partir del registro digital de actividades del Área de Proyectos.", {italics:true,color:"6B7280",size:16, after:0});
  try{
    const blob = await buildMembreteDocx(body);
    await downloadsCap.save({ filename: `Informe_Compensatorios_Bonos_${ym}.docx`, data: blob });
    showMsg("Informe de compensatorios y bonos descargado.", "ok");
  }catch(err){
    if(err && err.code==="declined") return;
    showMsg("No se pudo generar el Word: " + (err.message||err.code), "bad");
  }
}

// Empaqueta un cuerpo de Word con el membrete de Process (encabezado y pie de borde a borde).
async function buildMembreteDocx(body){
  body += `<w:sectPr><w:headerReference w:type="default" r:id="rIdHeader1"/><w:footerReference w:type="default" r:id="rIdFooter1"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="2500" w:right="1080" w:bottom="2600" w:left="1080" w:header="300" w:footer="300"/></w:sectPr>`;
  const HEADER_REL_ID = 900, FOOTER_REL_ID = 901, pageWpx = 816;
  const headerImg = wImageAnchor(MEMBRETE_HEADER_B64, HEADER_REL_ID, pageWpx, Math.round(pageWpx*(MEMBRETE_HEADER_DIM.h/MEMBRETE_HEADER_DIM.w)), "top");
  const footerImg = wImageAnchor(MEMBRETE_FOOTER_B64, FOOTER_REL_ID, pageWpx, Math.round(pageWpx*(MEMBRETE_FOOTER_DIM.h/MEMBRETE_FOOTER_DIM.w)), "bottom");
  const NS = `xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"`;
  const XMLH = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?>`;
  const REL = "http://schemas.openxmlformats.org/officeDocument/2006/relationships";
  const zip = new JSZip();
  zip.file("[Content_Types].xml", `${XMLH}<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`);
  zip.file("_rels/.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="${REL}/officeDocument" Target="word/document.xml"/></Relationships>`);
  zip.file("word/document.xml", `${XMLH}<w:document ${NS}><w:body>${body}</w:body></w:document>`);
  zip.file("word/_rels/document.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdHeader1" Type="${REL}/header" Target="header1.xml"/><Relationship Id="rIdFooter1" Type="${REL}/footer" Target="footer1.xml"/></Relationships>`);
  zip.file("word/header1.xml", `${XMLH}<w:hdr ${NS}>${headerImg.xml}</w:hdr>`);
  zip.file("word/footer1.xml", `${XMLH}<w:ftr ${NS}>${footerImg.xml}</w:ftr>`);
  zip.file("word/_rels/header1.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${HEADER_REL_ID}" Type="${REL}/image" Target="media/membreteHeader.png"/></Relationships>`);
  zip.file("word/_rels/footer1.xml.rels", `${XMLH}<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${FOOTER_REL_ID}" Type="${REL}/image" Target="media/membreteFooter.png"/></Relationships>`);
  zip.file("word/media/membreteHeader.png", headerImg.base64, {base64:true});
  zip.file("word/media/membreteFooter.png", footerImg.base64, {base64:true});
  return zip.generateAsync({ type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
}

function stopCompData(){
  compUnsubs.forEach(u=>{ try{ u && u(); }catch(e){} });
  compUnsubs = [];
  compEntries = []; campoEntries = []; compAjustes = {}; campoPagos = {}; compSaldos = {};
  compLoaded = {comp:false, campo:false};
}
function subscribeCompData(){
  stopCompData();
  if(!db || !isOwner) return;
  const rr = ()=>{ if(view==="compensatorios" || view==="bonos") render(); };
  const toMap = snap=>{ const m = {}; snap.docs.forEach(d=>{ m[d.id] = d.data(); }); return m; };
  // Consultas de un solo campo (sin orderBy) para no requerir índices compuestos; se ordena en el navegador.
  compUnsubs.push(db.collection("activities").where("tipoHora","in",["Extra","Compensatorio"]).limit(5000)
    .onSnapshot(snap=>{ compEntries = snap.docs.map(d=>({ _id:d.id, ...d.data() })); compLoaded.comp = true; rr(); },
      err=>showGlobalError("Compensatorios", err)));
  compUnsubs.push(db.collection("activities").where("actividad","==",ACTIVIDAD_CAMPO).limit(5000)
    .onSnapshot(snap=>{ campoEntries = snap.docs.map(d=>({ _id:d.id, ...d.data() })); compLoaded.campo = true; rr(); },
      err=>showGlobalError("Bonos de campo", err)));
  compUnsubs.push(db.collection("comp_ajustes").limit(5000)
    .onSnapshot(snap=>{ compAjustes = toMap(snap); rr(); }, err=>showGlobalError("Ajustes de compensatorios (revisa las reglas de Firestore)", err)));
  compUnsubs.push(db.collection("campo_pagos").limit(5000)
    .onSnapshot(snap=>{ campoPagos = toMap(snap); rr(); }, err=>showGlobalError("Pagos de bono de campo (revisa las reglas de Firestore)", err)));
  compUnsubs.push(db.collection("comp_saldos").limit(500)
    .onSnapshot(snap=>{ compSaldos = toMap(snap); rr(); }, err=>showGlobalError("Saldos iniciales (revisa las reglas de Firestore)", err)));
}

function subscribeOpenTasks(){
  if(unsubOpenTasks) unsubOpenTasks();
  if(!db || !selectedEngineer) return;
  // Sin límite de mes a propósito: una tarea bloqueada puede retomarse semanas después.
  unsubOpenTasks = db.collection("activities")
    .where("engineer","==",selectedEngineer).orderBy("fecha","desc").limit(300)
    .onSnapshot(snap=>{
      const entries = snap.docs.map(d=>d.data());
      const byTask = {};
      entries.forEach(d=>{
        if(!d.taskId) return; // registros antiguos sin tarea asignada: no entran al selector
        const t = byTask[d.taskId] || { taskId:d.taskId, proyecto:d.proyecto, actividad:d.actividad, detalle:d.detalle, pct:null, estado:null, fecha:null, _sortKey:"" };
        const sortKey = (d.fecha||"") + "T" + (d.createdAt||"");
        if(sortKey >= t._sortKey){
          t._sortKey = sortKey; t.fecha = d.fecha; t.proyecto = d.proyecto; t.actividad = d.actividad; t.detalle = d.detalle;
          if(typeof d.pct === "number") t.pct = d.pct;
          if(d.estado) t.estado = d.estado;
        }
        byTask[d.taskId] = t;
      });
      openTasksList = Object.values(byTask)
        .filter(t=>t.estado!=="Completada")
        .sort((a,b)=> (b._sortKey||"").localeCompare(a._sortKey||""));
      if(view==="form") render();
    }, err=>showGlobalError("Tareas abiertas", err));
}

// ---------- CSV ----------
function csvEsc(v){
  if(v==null) return "";
  const s = String(v).replace(/"/g,'""');
  return /[",\n]/.test(s) ? `"${s}"` : s;
}

function buildReportData(){
  const {days, start, end} = monthRange(selectedMonth);
  const weeks = days/7;
  const {byEng} = computeStats();
  const porEng = engineersList.map(eng=>{
    const e = byEng[eng.name];
    const estKey = slugify(eng.name);
    const estW = estimates[estKey]!=null ? Number(estimates[estKey]) : null;
    const estMes = estW!=null ? estW*weeks : null;
    const avg = e.lastPct;
    const diasSin = e.last ? Math.round((new Date(todayStr())-new Date(e.last))/86400000) : null;
    const estado = e.n===0 ? "Sin registros" : avg===null ? "Sin datos" : avg>=80 ? "Buen ritmo" : avg>=40 ? "En progreso" : "Rezagado";
    return { name: eng.name, cargo: eng.cargo||"", n: e.n, horas: e.horas, horasExtra: e.horasExtra, horasAusencia: e.horasAusencia, horasPorTipo: e.horasPorTipo, estMes, diff: estMes!=null?(e.horas-estMes):null, avg, last: e.last, diasSin, estado, taskList: e.taskList, completedCount: e.completedCount, openCount: e.openCount };
  });
  const tareas = [];
  porEng.forEach(e=> e.taskList.forEach(t=> tareas.push({ ingeniero:e.name, proyecto:t.proyecto, actividad:t.actividad, pct:t.pct, estado:t.estado, fecha:t.fecha })));
  const byAct = {}; allEntries.forEach(d=>{ const k=d.actividad||"(sin definir)"; if(!byAct[k]) byAct[k]={h:0,n:0}; byAct[k].h+=(d.horas||0); byAct[k].n++; });
  const byProy = {}; allEntries.forEach(d=>{ const k=d.proyecto||"(sin definir)"; if(!byProy[k]) byProy[k]={h:0,n:0}; byProy[k].h+=(d.horas||0); byProy[k].n++; });
  const byTipoHora = {}; allEntries.forEach(d=>{ const k=d.tipoHora||"Normal"; if(!byTipoHora[k]) byTipoHora[k]={h:0,n:0}; byTipoHora[k].h+=(d.horas||0); byTipoHora[k].n++; });
  // Horas extra: trabajo normal vs. movilización a campo (dato nuevo; los registros
  // viejos sin este campo se cuentan como "Trabajo normal" por compatibilidad).
  const byExtraSubtipo = {};
  allEntries.forEach(d=>{
    if((d.tipoHora||"Normal")!=="Extra") return;
    const k = d.extraTipo || "Trabajo normal";
    if(!byExtraSubtipo[k]) byExtraSubtipo[k] = {h:0,n:0};
    byExtraSubtipo[k].h += (d.horas||0); byExtraSubtipo[k].n++;
  });
  // Trabajo en fines de semana: para que gerencia identifique quién trabajó sábado/domingo.
  const trabajoFinDeSemana = allEntries.filter(d=> (d.horas||0)>0 && (weekdayOf(d.fecha)===6 || weekdayOf(d.fecha)===0))
    .sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const sabados = trabajoFinDeSemana.filter(d=>weekdayOf(d.fecha)===6);
  const domingos = trabajoFinDeSemana.filter(d=>weekdayOf(d.fecha)===0);
  const ingenierosSabado = [...new Set(sabados.map(d=>d.engineer))];
  const ingenierosDomingo = [...new Set(domingos.map(d=>d.engineer))];
  // Horas extra por ingeniero, separadas por sábado / domingo / movilización a campo —
  // esto es lo que define si se pagan en dinero (domingo) o se compensan en tiempo
  // (sábado y movilización), así que es la vista que de verdad le sirve a RR.HH.
  const extraPorIngeniero = engineersList.map(eng=>{
    const entries = allEntries.filter(d=> d.engineer===eng.name && (d.tipoHora||"Normal")==="Extra");
    const horasSabado = entries.filter(d=>weekdayOf(d.fecha)===6).reduce((s,d)=>s+(d.horas||0),0);
    const horasDomingo = entries.filter(d=>weekdayOf(d.fecha)===0).reduce((s,d)=>s+(d.horas||0),0);
    const horasMovilizacion = entries.filter(d=>(d.extraTipo||"Trabajo normal")==="Movilización a campo").reduce((s,d)=>s+(d.horas||0),0);
    const horasTotal = entries.reduce((s,d)=>s+(d.horas||0),0);
    return { name: eng.name, horasTotal, horasSabado, horasDomingo, horasMovilizacion };
  }).filter(e=>e.horasTotal>0);
  // Clasificación por convención de código: 3XXX Proyecto, 2XXX Servicio, 0XXX Capacitación
  const byCategoria = {};
  const codigosPorCategoria = {};
  allEntries.forEach(d=>{
    const cat = proyectoCategoria(d.proyecto);
    if(!byCategoria[cat]) byCategoria[cat] = {h:0,n:0,engs:new Set()};
    byCategoria[cat].h += (d.horas||0); byCategoria[cat].n++; byCategoria[cat].engs.add(d.engineer);
    if(cat==="Proyecto"||cat==="Servicio"||cat==="Capacitación"){
      const cod = proyectoCodigo(d.proyecto) || d.proyecto;
      if(!codigosPorCategoria[cat]) codigosPorCategoria[cat] = {};
      if(!codigosPorCategoria[cat][d.proyecto]) codigosPorCategoria[cat][d.proyecto] = {h:0,n:0};
      codigosPorCategoria[cat][d.proyecto].h += (d.horas||0);
      codigosPorCategoria[cat][d.proyecto].n++;
    }
  });
  // Bloqueos reales (estado="Bloqueada"): van a gerencia como novedad crítica.
  // Notas adicionales: cualquier otro registro con texto en Observaciones que NO está bloqueado —
  // se conservan en el reporte como contexto, pero separadas para no confundirlas con bloqueos.
  const bloqueos = allEntries.filter(d=> d.estado==="Bloqueada")
    .sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const notasAdicionales = allEntries.filter(d=> d.estado!=="Bloqueada" && d.obs && d.obs.trim())
    .sort((a,b)=>(a.fecha||"").localeCompare(b.fecha||""));
  const novedades = bloqueos.concat(notasAdicionales); // compat: CSV/consumidores que usaban la lista combinada
  const proyectosActivos = Object.keys(byProy).filter(k => k!==SIN_PROYECTO && k!==POR_DEFINIR && k!=="(sin definir)");
  const horasEnProyectos = proyectosActivos.reduce((s,k)=>s+byProy[k].h, 0);
  const totalHoras = porEng.reduce((s,e)=>s+e.horas,0);
  const horasApoyo = Math.max(0, totalHoras - horasEnProyectos);
  const statusCounts = { "Buen ritmo":0, "En progreso":0, "Rezagado":0, "Sin registros":0, "Sin datos":0 };
  porEng.forEach(e=>{ statusCounts[e.estado] = (statusCounts[e.estado]||0)+1; });
  return { start, end, porEng, byAct, byProy, byTipoHora, byExtraSubtipo, extraPorIngeniero, byCategoria, codigosPorCategoria, novedades, bloqueos, notasAdicionales, proyectosActivos, horasEnProyectos, horasApoyo, statusCounts, tareas,
    sabados, domingos, ingenierosSabado, ingenierosDomingo,
    totalHoras, totalRegistros: porEng.reduce((s,e)=>s+e.n,0),
    sinRegistros: porEng.filter(e=>e.n===0).map(e=>e.name) };
}

async function downloadCsvReport(){
  if(!downloadsCap){ showMsg("La descarga no está disponible en esta vista.", "bad"); return; }
  const r = buildReportData();
  const lines = [];
  lines.push(`Reporte de Actividades - ${monthLabel(selectedMonth)}`);
  lines.push(`Periodo:,${r.start},a,${r.end}`);
  lines.push("");
  lines.push("RESUMEN POR INGENIERO");
  lines.push("Ingeniero,Cargo,Registros,Horas trabajadas,Horas extra,Horas ausencia,Horas estimadas (mes),Diferencia,% Avance (prom. tareas en curso),Tareas completadas,Tareas en curso,Ultima actualizacion,Dias sin actualizar,Estado");
  r.porEng.forEach(e=>{
    lines.push([e.name,e.cargo,e.n,e.horas.toFixed(1),e.horasExtra.toFixed(1),e.horasAusencia.toFixed(1),e.estMes!=null?e.estMes.toFixed(1):"",e.diff!=null?e.diff.toFixed(1):"",e.avg!=null?e.avg:"",e.completedCount,e.openCount,e.last||"",e.diasSin!=null?e.diasSin:"",e.estado].map(csvEsc).join(","));
  });
  lines.push("");
  lines.push("HORAS POR TIPO DE HORA (Normal/Extra/Vacaciones/etc.)");
  lines.push("Tipo,Horas,Registros");
  Object.keys(r.byTipoHora).sort((a,b)=>r.byTipoHora[b].h-r.byTipoHora[a].h).forEach(k=>lines.push([k,r.byTipoHora[k].h.toFixed(1),r.byTipoHora[k].n].map(csvEsc).join(",")));
  lines.push("");
  lines.push("HORAS EXTRA: TRABAJO NORMAL VS MOVILIZACION A CAMPO (total del area)");
  lines.push("Tipo de hora extra,Horas,Registros");
  Object.keys(r.byExtraSubtipo).sort((a,b)=>r.byExtraSubtipo[b].h-r.byExtraSubtipo[a].h).forEach(k=>lines.push([k,r.byExtraSubtipo[k].h.toFixed(1),r.byExtraSubtipo[k].n].map(csvEsc).join(",")));
  lines.push("");
  lines.push("HORAS EXTRA POR COLABORADOR (sabado=compensatorio, domingo=dinero, movilizacion=compensatorio)");
  lines.push("Colaborador,Total extra,Sabado,Domingo,Movilizacion a campo");
  r.extraPorIngeniero.forEach(e=>lines.push([e.name,e.horasTotal.toFixed(1),e.horasSabado.toFixed(1),e.horasDomingo.toFixed(1),e.horasMovilizacion.toFixed(1)].map(csvEsc).join(",")));
  lines.push("");
  lines.push("HORAS POR TIPO DE ACTIVIDAD");
  lines.push("Actividad,Horas,Registros");
  Object.keys(r.byAct).sort((a,b)=>r.byAct[b].h-r.byAct[a].h).forEach(k=>lines.push([k,r.byAct[k].h.toFixed(1),r.byAct[k].n].map(csvEsc).join(",")));
  lines.push("");
  lines.push("HORAS POR PROYECTO / CENTRO DE COSTO");
  lines.push("Proyecto / Centro de costo,Horas,Registros");
  Object.keys(r.byProy).sort((a,b)=>r.byProy[b].h-r.byProy[a].h).forEach(k=>lines.push([k,r.byProy[k].h.toFixed(1),r.byProy[k].n].map(csvEsc).join(",")));
  lines.push("");
  lines.push("BLOQUEOS REPORTADOS (estado = Bloqueada)");
  lines.push("Fecha,Ingeniero,Actividad,Estado,Observacion");
  r.bloqueos.forEach(d=>lines.push([d.fecha,d.engineer,d.actividad,d.estado,d.obs||""].map(csvEsc).join(",")));
  lines.push("");
  lines.push("NOTAS Y OBSERVACIONES ADICIONALES (no son bloqueos)");
  lines.push("Fecha,Ingeniero,Actividad,Estado,Observacion");
  r.notasAdicionales.forEach(d=>lines.push([d.fecha,d.engineer,d.actividad,d.estado,d.obs||""].map(csvEsc).join(",")));
  lines.push("");
  lines.push("TRABAJO EN SABADO");
  lines.push(`Colaboradores: ${r.ingenierosSabado.join(" | ") || "ninguno"}`);
  lines.push("Fecha,Ingeniero,Tipo de hora,Horas,Actividad");
  r.sabados.forEach(d=>lines.push([d.fecha,d.engineer,(d.tipoHora==="Extra"&&d.extraTipo)?`Extra - ${d.extraTipo}`:(d.tipoHora||"Normal"),(d.horas||0).toFixed(1),d.actividad||""].map(csvEsc).join(",")));
  lines.push("");
  lines.push("TRABAJO EN DOMINGO");
  lines.push(`Colaboradores: ${r.ingenierosDomingo.join(" | ") || "ninguno"}`);
  lines.push("Fecha,Ingeniero,Tipo de hora,Horas,Actividad");
  r.domingos.forEach(d=>lines.push([d.fecha,d.engineer,(d.tipoHora==="Extra"&&d.extraTipo)?`Extra - ${d.extraTipo}`:(d.tipoHora||"Normal"),(d.horas||0).toFixed(1),d.actividad||""].map(csvEsc).join(",")));

  const csv = "\uFEFF" + lines.join("\n");
  try{ await downloadsCap.save({ filename: `Reporte_Actividades_${selectedMonth}.csv`, data: csv }); showMsg("CSV descargado.", "ok"); }
  catch(err){ if(err && err.code!=="declined") showMsg("No se pudo descargar: "+(err.message||err.code), "bad"); }
}
