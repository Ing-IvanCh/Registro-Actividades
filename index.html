function drawBarChartPNG(title, labels, values, colors){
  const W=920, H=520, padL=60, padR=30, padT=50, padB=90;
  const canvas = document.createElement("canvas");
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#ffffff"; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = "#1F4E78"; ctx.font = "bold 20px Arial"; ctx.textAlign = "left";
  ctx.fillText(title, padL, 30);
  const maxVal = Math.max(1, ...values);
  const niceMax = Math.ceil(maxVal*1.15 / 5) * 5 || 1;
  const chartH = H - padT - padB, chartW = W - padL - padR;
  // gridlines + eje Y
  ctx.strokeStyle = "#E2E8F0"; ctx.fillStyle = "#6B7280"; ctx.font = "12px Arial"; ctx.textAlign = "right";
  for(let i=0;i<=5;i++){
    const y = padT + chartH - (chartH*i/5);
    ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke();
    ctx.fillText(Math.round(niceMax*i/5), padL-8, y+4);
  }
  // barras
  const n = labels.length || 1;
  const slot = chartW/n, barW = Math.min(70, slot*0.55);
  labels.forEach((lab,i)=>{
    const v = values[i]||0;
    const barH = chartH * (v/niceMax);
    const x = padL + slot*i + (slot-barW)/2;
    const y = padT + chartH - barH;
    ctx.fillStyle = (colors && colors[i]) || "#1F4E78";
    ctx.fillRect(x,y,barW,barH);
    ctx.fillStyle = "#1F4E78"; ctx.font="bold 13px Arial"; ctx.textAlign="center";
    ctx.fillText(v.toFixed(1), x+barW/2, y-6);
    ctx.fillStyle = "#374151"; ctx.font="12px Arial";
    const words = String(lab).split(" ");
    let line1=lab, line2="";
    if(lab.length>16){ const mid=Math.ceil(words.length/2); line1=words.slice(0,mid).join(" "); line2=words.slice(mid).join(" "); }
    ctx.fillText(line1, x+barW/2, padT+chartH+18);
    if(line2) ctx.fillText(line2, x+barW/2, padT+chartH+34);
  });
  ctx.strokeStyle = "#9CA3AF"; ctx.beginPath(); ctx.moveTo(padL,padT+chartH); ctx.lineTo(W-padR,padT+chartH); ctx.stroke();
  return canvas.toDataURL("image/png").split(",")[1]; // base64 puro
}

function wImage(base64Png, relId, widthPx, heightPx){
  // 9525 EMU por pixel (96dpi)
  const cx = Math.round(widthPx*9525), cy = Math.round(heightPx*9525);
  return { base64: base64Png, xml: `<w:p><w:pPr><w:jc w:val="center"/><w:spacing w:after="200"/></w:pPr><w:r><w:drawing><wp:inline distT="0" distB="0" distL="0" distR="0"><wp:extent cx="${cx}" cy="${cy}"/><wp:docPr id="${relId}" name="chart${relId}"/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${relId}" name="chart${relId}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${relId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:inline></w:drawing></w:r></w:p>` };
}

// Imagen "flotante" anclada a la página (de borde a borde), usada para el membrete
// en el encabezado y pie de página del Word — distinto de wImage() que es inline en el cuerpo.
function wImageAnchor(base64Png, relId, widthPx, heightPx, vAlign){
  const cx = Math.round(widthPx*9525), cy = Math.round(heightPx*9525);
  const xml = `<w:p><w:r><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="${251658240+relId}" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="page"><wp:align>left</wp:align></wp:positionH><wp:positionV relativeFrom="page"><wp:align>${vAlign}</wp:align></wp:positionV><wp:extent cx="${cx}" cy="${cy}"/><wp:wrapNone/><wp:docPr id="${relId}" name="Membrete${relId}"/><wp:cNvGraphicFramePr><a:graphicFrameLocks xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main" noChangeAspect="1"/></wp:cNvGraphicFramePr><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${relId}" name="Membrete${relId}"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="rIdImg${relId}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${cx}" cy="${cy}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r></w:p>`;
  return { base64: base64Png, xml };
}

function xmlEsc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function wp(text, opts={}){
  const { bold, color, size=21, after=160, italics } = opts;
  let rpr = "";
  if(bold) rpr += "<w:b/>";
  if(italics) rpr += "<w:i/>";
  if(color) rpr += `<w:color w:val="${color}"/>`;
  rpr += `<w:sz w:val="${size}"/>`;
  return `<w:p><w:pPr><w:spacing w:after="${after}"/></w:pPr><w:r><w:rPr>${rpr}</w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function wBullet(text){
  return `<w:p><w:pPr><w:spacing w:after="80"/><w:ind w:left="420" w:hanging="300"/></w:pPr><w:r><w:rPr><w:sz w:val="21"/></w:rPr><w:t xml:space="preserve">•  ${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function wHeading(text){
  return `<w:p><w:pPr><w:spacing w:before="280" w:after="140"/><w:pBdr><w:bottom w:val="single" w:sz="6" w:color="1F4E78" w:space="4"/></w:pBdr></w:pPr><w:r><w:rPr><w:b/><w:color w:val="1F4E78"/><w:sz w:val="26"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p>`;
}
function wTc(text, width, header){
  const shd = header ? '<w:shd w:val="clear" w:fill="1F4E78"/>' : "";
  const rpr = header ? '<w:b/><w:color w:val="FFFFFF"/>' : "";
  return `<w:tc><w:tcPr><w:tcW w:w="${width}" w:type="dxa"/>${shd}</w:tcPr><w:p><w:r><w:rPr>${rpr}<w:sz w:val="18"/></w:rPr><w:t xml:space="preserve">${xmlEsc(text)}</w:t></w:r></w:p></w:tc>`;
}
function wTable(headers, widths, rows){
  const grid = widths.map(w=>`<w:gridCol w:w="${w}"/>`).join("");
  const hdr = "<w:tr>" + headers.map((h,i)=>wTc(h,widths[i],true)).join("") + "</w:tr>";
  const body = rows.map(row=>"<w:tr>"+row.map((c,i)=>wTc(c,widths[i],false)).join("")+"</w:tr>").join("");
  return `<w:tbl><w:tblPr><w:tblW w:w="0" w:type="auto"/><w:tblBorders><w:top w:val="single" w:sz="4" w:color="CCCCCC"/><w:left w:val="single" w:sz="4" w:color="CCCCCC"/><w:bottom w:val="single" w:sz="4" w:color="CCCCCC"/><w:right w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideH w:val="single" w:sz="4" w:color="CCCCCC"/><w:insideV w:val="single" w:sz="4" w:color="CCCCCC"/></w:tblBorders></w:tblPr><w:tblGrid>${grid}</w:tblGrid>${hdr}${body}</w:tbl><w:p/>`;
}

async function downloadWordReport(){
  if(!downloadsCap){ showMsg("La descarga no está disponible en esta vista.", "bad"); return; }
  if(typeof JSZip === "undefined"){ showMsg("No se pudo cargar el generador de Word. Intenta de nuevo.", "bad"); return; }
  const r = buildReportData();
  const pctEnProyectos = r.totalHoras>0 ? Math.round((r.horasEnProyectos/r.totalHoras)*100) : 0;
  const images = []; // {base64, xml}
  let body = "";
  body += wp("INFORME DE SEGUIMIENTO DE ACTIVIDADES", {bold:true, color:"1F4E78", size:32, after:40});
  body += wp("Área de Proyectos", {bold:true, color:"6B7280", size:24, after:20});
  body += wp(`Periodo: ${monthLabel(selectedMonth)}   ·   Corte: ${new Date().toLocaleDateString("es-CO",{day:"numeric",month:"long",year:"numeric"})}`, {italics:true, color:"6B7280", size:20, after:260});

  // ---- Categorías (clasificación por código: 3XXX Proyecto, 2XXX Servicio, 0XXX Capacitación) ----
  const CAT_ORDER = ["Proyecto","Servicio","Capacitación","Apoyo interno / sin código","Otro"];
  const catsConDatos = CAT_ORDER.filter(c=>r.byCategoria[c] && r.byCategoria[c].h>0);
  const catColors = { "Proyecto":"#1F4E78", "Servicio":"#2E7D32", "Capacitación":"#B26A00", "Apoyo interno / sin código":"#6B7280", "Otro":"#9CA3AF" };

  body += wHeading("1. Resumen ejecutivo");
  if(r.totalRegistros === 0){
    body += wp("No se registraron actividades durante el periodo seleccionado. No es posible generar un análisis de carga de trabajo hasta que el equipo registre información.");
  } else {
    const topCat = catsConDatos.length ? catsConDatos.reduce((a,b)=> r.byCategoria[b].h>r.byCategoria[a].h?b:a) : null;
    if(topCat){
      const pctTop = Math.round((r.byCategoria[topCat].h/r.totalHoras)*100);
      body += wp(`Del total de ${r.totalHoras.toFixed(1)} horas reportadas en el periodo, la mayor concentración corresponde a ${topCat.toLowerCase()} con ${r.byCategoria[topCat].h.toFixed(1)} horas (${pctTop}%). La sección 2 desglosa la distribución completa entre Proyectos, Servicios, Capacitaciones y apoyo interno.`);
    } else {
      body += wp(`Las ${r.totalHoras.toFixed(1)} horas reportadas en el periodo no se asociaron a proyectos, servicios ni capacitaciones con código formal.`);
    }
    if(r.byCategoria["Capacitación"] && r.byCategoria["Capacitación"].h>0){
      body += wp(`Se invirtieron ${r.byCategoria["Capacitación"].h.toFixed(1)} horas en capacitación durante el periodo, lo que representa inversión en formación del equipo.`);
    } else {
      body += wp("No se registraron horas de capacitación en el periodo — punto a considerar para el desarrollo del equipo.", {italics:true, color:"6B7280", size:18});
    }
    const sc = r.statusCounts;
    body += wp(`Estado del equipo: ${sc["Buen ritmo"]} en buen ritmo, ${sc["En progreso"]} en progreso, ${sc["Rezagado"]} rezagado(s), ${sc["Sin registros"]} sin registros${sc["Sin datos"]?`, ${sc["Sin datos"]} sin datos de avance`:""}.`);
  }
  body += wBullet(`${engineersList.length} colaboradores en el área.`);
  body += wBullet(`${r.totalRegistros} actividad(es) registrada(s) en el periodo, con un total de ${r.totalHoras.toFixed(1)} horas reportadas.`);
  body += wBullet(r.sinRegistros.length ? `Colaborador(es) sin registros en el periodo: ${r.sinRegistros.join(", ")}.` : "Todos los colaboradores presentan al menos un registro en el periodo.");
  body += wp("Nota: los totales reflejan la información cargada hasta la fecha de corte; si el mes está en curso, interprételos como una fotografía preliminar.", {italics:true, color:"6B7280", size:18});

  body += wHeading("2. Análisis por categoría: Proyectos, Servicios y Capacitaciones");
  body += wp("Clasificación automática según el código asignado a cada proyecto/centro de costo: 3XXX = Proyecto, 2XXX = Servicio, 0XXX = Capacitación.", {italics:true, color:"6B7280", size:18});
  if(catsConDatos.length){
    const imgId = images.length+1;
    const png = drawBarChartPNG("Horas por categoría", catsConDatos, catsConDatos.map(c=>r.byCategoria[c].h), catsConDatos.map(c=>catColors[c]));
    const img = wImage(png, imgId, 460, 260);
    images.push({base64:img.base64, relId:imgId});
    body += img.xml;
  }
  body += wTable(["Categoría","Horas","% del total","Códigos distintos","Colaboradores"],[2600,1300,1400,1700,1600],
    CAT_ORDER.filter(c=>r.byCategoria[c]).map(c=>{
      const d = r.byCategoria[c];
      const pct = r.totalHoras>0 ? Math.round((d.h/r.totalHoras)*100) : 0;
      const nCodigos = r.codigosPorCategoria[c] ? Object.keys(r.codigosPorCategoria[c]).length : "—";
      return [c, d.h.toFixed(1)+" h", pct+"%", String(nCodigos), String(d.engs.size)];
    }));
  ["Proyecto","Servicio","Capacitación"].forEach(cat=>{
    const codigos = r.codigosPorCategoria[cat];
    if(!codigos) return;
    body += wp(`Detalle de ${cat.toLowerCase()}s activos:`, {bold:true, size:19, after:80});
    const rows = Object.keys(codigos).sort((a,b)=>codigos[b].h-codigos[a].h).map(k=>[k, codigos[k].h.toFixed(1)+" h", String(codigos[k].n)]);
    body += wTable([cat,"Horas","Registros"],[5400,1500,1500],rows);
  });

  body += wHeading("3. Resumen por colaborador");
  {
    const imgId = images.length+1;
    const labsEng = r.porEng.map(e=>e.name);
    const valsEng = r.porEng.map(e=>e.horas);
    const png = drawBarChartPNG("Horas trabajadas por colaborador", labsEng, valsEng, labsEng.map(()=> "#1F4E78"));
    const img = wImage(png, imgId, 460, 260);
    images.push({base64:img.base64, relId:imgId});
    body += img.xml;
  }
  body += wTable(["Colaborador","Horas trab.","Horas extra","Tareas compl.","Tareas en curso","% Avance (en curso)","Estado"],
    [1700,1100,1100,1200,1300,1400,1200],
    r.porEng.map(e=>[e.name,e.horas.toFixed(1)+" h",e.horasExtra.toFixed(1)+" h",String(e.completedCount),String(e.openCount),e.avg!=null?e.avg+"%":"—",e.estado]));

  body += wHeading("4. Detalle de tareas por colaborador");
  body += wp("Cada línea es una tarea distinta (combinación de proyecto y tipo de actividad) con su avance más reciente registrado. El % de la sección 3 es el promedio de estas tareas, no un dato suelto.", {italics:true, color:"6B7280", size:18});
  body += r.tareas.length
    ? wTable(["Colaborador","Proyecto","Actividad","% Avance","Estado","Fecha"],[1500,1700,1900,1100,1200,1000],
        r.tareas.map(t=>[t.ingeniero,t.proyecto,t.actividad,t.pct!=null?t.pct+"%":"—",t.estado||"",t.fecha||""]))
    : wp("Sin tareas registradas en el periodo.",{italics:true,color:"6B7280"});

  body += wHeading("5. Horas por tipo de hora (Normal, Extra, Vacaciones, etc.)");
  const tipoRows = Object.keys(r.byTipoHora).sort((a,b)=>r.byTipoHora[b].h-r.byTipoHora[a].h).map(k=>[k, r.byTipoHora[k].h.toFixed(1)+" h", String(r.byTipoHora[k].n)]);
  body += tipoRows.length ? wTable(["Tipo de hora","Horas","Registros"],[2400,1300,1300],tipoRows) : wp("Sin datos en el periodo.",{italics:true,color:"6B7280"});
  if(Object.keys(r.byExtraSubtipo).length){
    body += wp("Horas extra: trabajo normal vs. movilización a campo (total del área)", {bold:true, size:19, after:80});
    const extraRows = Object.keys(r.byExtraSubtipo).sort((a,b)=>r.byExtraSubtipo[b].h-r.byExtraSubtipo[a].h).map(k=>[k, r.byExtraSubtipo[k].h.toFixed(1)+" h", String(r.byExtraSubtipo[k].n)]);
    body += wTable(["Tipo de hora extra","Horas","Registros"],[2400,1300,1300],extraRows);
  }
  if(r.extraPorIngeniero.length){
    body += wp("Horas extra por colaborador: sábado, domingo y movilización", {bold:true, size:19, after:40});
    body += wp("Las de domingo normalmente se pagan en dinero; las de sábado y movilización a campo suelen compensarse en tiempo.", {italics:true, color:"6B7280", size:18, after:80});
    body += wTable(["Colaborador","Total extra","Sábado","Domingo","Movilización a campo"],[1800,1200,1200,1200,1800],
      r.extraPorIngeniero.map(e=>[e.name, e.horasTotal.toFixed(1)+" h", e.horasSabado.toFixed(1)+" h", e.horasDomingo.toFixed(1)+" h", e.horasMovilizacion.toFixed(1)+" h"]));
  }

  body += wHeading("6. Horas por tipo de actividad");
  const actRows = Object.keys(r.byAct).sort((a,b)=>r.byAct[b].h-r.byAct[a].h).map(k=>[k, r.byAct[k].h.toFixed(1)+" h", String(r.byAct[k].n)]);
  body += actRows.length ? wTable(["Tipo de actividad","Horas","Registros"],[5400,1500,1500],actRows) : wp("Sin datos en el periodo.",{italics:true,color:"6B7280"});

  body += wHeading("7. Novedades, problemas o bloqueos reportados");
  body += wp("7.1 Bloqueos reportados (requieren atención)", {bold:true, size:19, after:80});
  body += r.bloqueos.length
    ? wTable(["Fecha","Colaborador","Actividad","Estado","Observación"],[1100,1500,1900,1200,2700],
        r.bloqueos.map(d=>[d.fecha,d.engineer,d.actividad,d.estado,d.obs||""]))
    : wp("No se reportaron bloqueos en el periodo.", {italics:true,color:"6B7280"});
  body += wp("7.2 Notas y contexto adicional (no son bloqueos, solo información de apoyo)", {bold:true, size:19, after:80});
  body += r.notasAdicionales.length
    ? wTable(["Fecha","Colaborador","Actividad","Estado","Observación"],[1100,1500,1900,1200,2700],
        r.notasAdicionales.map(d=>[d.fecha,d.engineer,d.actividad,d.estado,d.obs||""]))
    : wp("Sin notas adicionales en el periodo.", {italics:true,color:"6B7280"});

  body += wHeading("8. Trabajo en fines de semana (sábados y domingos)");
  body += wp(`Colaboradores que registraron horas en sábado: ${r.ingenierosSabado.length ? r.ingenierosSabado.join(", ") : "ninguno"}.`, {after:60});
  body += wp(`Colaboradores que registraron horas en domingo: ${r.ingenierosDomingo.length ? r.ingenierosDomingo.join(", ") : "ninguno"}.`, {after:160});
  body += wp("8.1 Detalle de sábados trabajados", {bold:true, size:19, after:80});
  body += r.sabados.length
    ? wTable(["Fecha","Colaborador","Tipo de hora","Horas","Actividad"],[1200,1600,1500,1000,2500],
        r.sabados.map(d=>[d.fecha, d.engineer, (d.tipoHora==="Extra"&&d.extraTipo)?`Extra · ${d.extraTipo}`:(d.tipoHora||"Normal"), (d.horas||0).toFixed(1)+" h", d.actividad||""]))
    : wp("No se registraron horas en sábado durante el periodo.", {italics:true,color:"6B7280"});
  body += wp("8.2 Detalle de domingos trabajados", {bold:true, size:19, after:80});
  body += r.domingos.length
    ? wTable(["Fecha","Colaborador","Tipo de hora","Horas","Actividad"],[1200,1600,1500,1000,2500],
        r.domingos.map(d=>[d.fecha, d.engineer, (d.tipoHora==="Extra"&&d.extraTipo)?`Extra · ${d.extraTipo}`:(d.tipoHora||"Normal"), (d.horas||0).toFixed(1)+" h", d.actividad||""]))
    : wp("No se registraron horas en domingo durante el periodo.", {italics:true,color:"6B7280"});

  body += wHeading("9. Conclusiones y recomendaciones");
  body += wBullet(r.proyectosActivos.length
    ? "Formalizar el seguimiento de los proyectos, servicios y capacitaciones activos, y mantener el registro diario para controlar el avance real frente al estimado."
    : "Dado que no hay proyectos activos, se recomienda formalizar la asignación de actividades de apoyo a otras áreas para los colaboradores con menor carga registrada.");
  if(!(r.byCategoria["Capacitación"] && r.byCategoria["Capacitación"].h>0)){
    body += wBullet("Evaluar la programación de capacitaciones en el próximo periodo, dado que no se registró inversión de tiempo en formación este mes.");
  }
  body += wBullet(r.sinRegistros.length ? `Validar con ${r.sinRegistros.join(" y ")} el motivo de la ausencia de registros en el periodo.` : "Mantener el seguimiento diario para consolidar tendencias de carga de trabajo mes a mes.");
  body += wBullet("Continuar el registro diario a través de la herramienta digital del área para mantener este informe actualizable en cualquier momento del mes.");
  body += wp("Informe generado a partir del registro digital de actividades del Área de Proyectos.", {italics:true,color:"6B7280",size:16, after:0});
  body += `<w:sectPr><w:headerReference w:type="default" r:id="rIdHeader1"/><w:footerReference w:type="default" r:id="rIdFooter1"/><w:pgSz w:w="12240" w:h="15840"/><w:pgMar w:top="2500" w:right="1080" w:bottom="2600" w:left="1080" w:header="300" w:footer="300"/></w:sectPr>`;

  // ---- Membrete (header/footer de Process, de borde a borde en cada página) ----
  const HEADER_REL_ID = 900, FOOTER_REL_ID = 901;
  const pageWpx = 816; // 8.5in a 96dpi: ancho completo de la página
  const headerHpx = Math.round(pageWpx * (MEMBRETE_HEADER_DIM.h/MEMBRETE_HEADER_DIM.w));
  const footerHpx = Math.round(pageWpx * (MEMBRETE_FOOTER_DIM.h/MEMBRETE_FOOTER_DIM.w));
  const headerImg = wImageAnchor(MEMBRETE_HEADER_B64, HEADER_REL_ID, pageWpx, headerHpx, "top");
  const footerImg = wImageAnchor(MEMBRETE_FOOTER_B64, FOOTER_REL_ID, pageWpx, footerHpx, "bottom");
  const headerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:hdr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">${headerImg.xml}</w:hdr>`;
  const footerXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:ftr xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing">${footerImg.xml}</w:ftr>`;
  const headerRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${HEADER_REL_ID}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/membreteHeader.png"/></Relationships>`;
  const footerRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdImg${FOOTER_REL_ID}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/membreteFooter.png"/></Relationships>`;

  const documentXml = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships" xmlns:wp="http://schemas.openxmlformats.org/drawingml/2006/wordprocessingDrawing"><w:body>${body}</w:body></w:document>`;
  const contentTypes = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Default Extension="png" ContentType="image/png"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/><Override PartName="/word/header1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml"/><Override PartName="/word/footer1.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml"/></Types>`;
  const rootRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>`;
  const docRels = `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rIdHeader1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/header" Target="header1.xml"/><Relationship Id="rIdFooter1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer" Target="footer1.xml"/>${images.map(im=>`<Relationship Id="rIdImg${im.relId}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/chart${im.relId}.png"/>`).join("")}</Relationships>`;

  try{
    const zip = new JSZip();
    zip.file("[Content_Types].xml", contentTypes);
    zip.file("_rels/.rels", rootRels);
    zip.file("word/document.xml", documentXml);
    zip.file("word/_rels/document.xml.rels", docRels);
    zip.file("word/header1.xml", headerXml);
    zip.file("word/footer1.xml", footerXml);
    zip.file("word/_rels/header1.xml.rels", headerRels);
    zip.file("word/_rels/footer1.xml.rels", footerRels);
    zip.file("word/media/membreteHeader.png", headerImg.base64, {base64:true});
    zip.file("word/media/membreteFooter.png", footerImg.base64, {base64:true});
    images.forEach(im=> zip.file(`word/media/chart${im.relId}.png`, im.base64, {base64:true}));
    const blob = await zip.generateAsync({ type:"blob", mimeType:"application/vnd.openxmlformats-officedocument.wordprocessingml.document" });
    await downloadsCap.save({ filename: `Informe_Actividades_${selectedMonth}.docx`, data: blob });
    showMsg("Informe Word descargado.", "ok");
  }catch(err){
    if(err && err.code==="declined") return;
    showMsg("No se pudo generar el Word: " + (err.message||err.code), "bad");
  }
}

async function submitAdminLogin(){
  const emailEl = document.getElementById("admin_email_input");
  const passEl = document.getElementById("admin_pass_input");
  const email = emailEl ? emailEl.value.trim() : "";
  const password = passEl ? passEl.value : "";
  if(!email || !password){ adminLoginError = "Completa correo y contraseña."; render(); return; }
  try{
    await window.__firebaseAuth.loginAdmin(email, password);
    // isOwner se actualiza solo via onChange() más abajo
    adminLoginOpen = false; adminLoginError = "";
    render();
  }catch(err){
    adminLoginError = "No se pudo iniciar sesión: " + (err.message || err.code);
    render();
  }
}
async function lockAdmin(){
  stopCompData(); // antes de salir, para que las colecciones solo-admin no den error de permisos
  try{ await window.__firebaseAuth.logoutAdmin(); }catch(e){ console.error(e); }
  view = "form";
}

async function init(){
  render();
  let tries = 0;
  while(!(window.__firebaseDb && window.__firebaseAuth) && tries < 50){ await new Promise(r=>setTimeout(r,100)); tries++; }
  db = window.__firebaseDb || null;
  downloadsCap = { save: async ({filename, data})=>{
    const blob = (data instanceof Blob) ? data : new Blob([data], {type: filename.endsWith(".csv") ? "text/csv;charset=utf-8" : "application/octet-stream"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  }};
  if(!db || !window.__firebaseAuth){
    app.innerHTML = `<h1>Registro Diario de Actividades</h1><div class="card"><div class="empty">No se pudo conectar con Firebase. Revisa tu conexión o recarga la página.</div></div>`;
    return;
  }
  try{ await window.__firebaseAuth.ensureSignedIn(); }
  catch(err){
    app.innerHTML = `<h1>Registro Diario de Actividades</h1><div class="card"><div class="empty">No se pudo iniciar sesión en Firebase: ${err.message||err.code}. Revisa que "Anónimo" esté activado en Authentication → Sign-in method.</div></div>`;
    return;
  }
  window.__firebaseAuth.onChange(()=>{
    const wasOwner = isOwner;
    isOwner = window.__firebaseAuth.isAdminNow();
    if(wasOwner !== isOwner){
      if(isOwner) subscribeCompData();
      else { stopCompData(); if(view==="compensatorios" || view==="bonos") view = "form"; }
      render();
    }
  });
  isOwner = window.__firebaseAuth.isAdminNow();
  if(isOwner && !compUnsubs.length) subscribeCompData();
  subscribeEngineers();
  subscribeAll();
  subscribeEstimates();
  subscribeProjects();
  render();
}
init();
</script>
